---
name: Dagger Tests
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Dagger Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Dagger tests and generate report
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"
          verb: call
          module: .dagger
          args: >-
            run-all-tests-with-report --source . --fail-on-error=false
            export --path=./test-report.json

      - name: Display test report
        if: always()
        run: |
          if [ -f ./test-report.json ]; then
            echo "=== Test Report ==="
            cat ./test-report.json
          else
            echo "Test report not found"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ./test-report.json
          retention-days: 30

      # The Dagger call above is run with --fail-on-error=false so the report is
      # always exported and uploaded. This step is what turns a failing suite
      # into a failing job - without it the pipeline is green no matter what.
      - name: Fail on failing tests
        run: |
          if [ ! -f ./test-report.json ]; then
            echo "::error::no test report was produced - the test run itself failed"
            exit 1
          fi
          failed=$(jq -r '.failed_tests' ./test-report.json)
          total=$(jq -r '.total_tests' ./test-report.json)
          if [ "${failed}" != "0" ]; then
            jq -r '.results[] | select(.status == "failed")
                   | "::error title=\(.test_path)::\(.error)"' ./test-report.json
            echo "${failed} of ${total} tests failed"
            exit 1
          fi
          echo "all ${total} tests passed"
