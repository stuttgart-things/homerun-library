---
name: Dagger Static Checks
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Run Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Dagger static checks
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"
          verb: call
          module: .dagger
          args: >-
            run-static-stage --src . --lint-can-fail=true --go-version=1.26.6 --test=true
            export --path=./static-analysis-report.json

      # Hard gate: main is clean as of v3.1.7 and every finding here would
      # propagate into all seven homerun2 services that import this library.
      # The Dagger function still writes the full report before failing.
      - name: Run govulncheck
        if: always()
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"
          verb: call
          module: .dagger
          args: >-
            govulncheck --src . --go-version=1.26.6
            export --path=./govulncheck-report.txt

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: ./govulncheck-report.txt
          # On a failing gate the Dagger call exits before export runs; the
          # findings are in the step log above, so no artifact is expected.
          if-no-files-found: ignore

      - name: Display static analysis report
        if: always()
        run: |
          if [ -f ./static-analysis-report.json ]; then
            echo "=== Static Analysis Report ==="
            cat ./static-analysis-report.json
          else
            echo "Static analysis report not found"
          fi

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-report
          path: ./static-analysis-report.json

      # run-static-stage writes "has_failures" into the report and still exits 0.
      # Without this step a failing `go test` inside the stage goes unnoticed.
      - name: Fail on failing tests
        if: always()
        run: |
          if [ ! -f ./static-analysis-report.json ]; then
            echo "::error::no static analysis report was produced"
            exit 1
          fi
          if [ "$(jq -r '.lint.failed' ./static-analysis-report.json)" = "true" ]; then
            echo "::warning::golangci-lint reported findings (lint-can-fail=true, not blocking)"
            jq -r '.lint.findings[]?' ./static-analysis-report.json
          fi
          if [ "$(jq -r '.test.failed' ./static-analysis-report.json)" = "true" ]; then
            echo "::error::go test failed inside the static stage"
            jq -r '.test.output' ./static-analysis-report.json
            exit 1
          fi
          echo "static stage clean"
